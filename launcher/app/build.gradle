plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minimaltv.home'
    compileSdk 34

    defaultConfig {
        applicationId 'com.minimaltv.home'
        minSdk 26
        targetSdk 34
        versionCode 43
        versionName '43'
    }

    buildTypes {
        release {
            // R8 strips the code and resources: smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // Play Store rules that do not apply to a sideloaded home screen: it is a HOME app rather than a TV
        // launcher-row entry, and it needs QUERY_ALL_PACKAGES to list every app on Android 11+.
        disable 'MissingLeanbackLauncher', 'QueryAllPackagesPermission'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies on purpose: framework widgets only, so the launcher starts fast and stays small.

// v24: JVM UI tests (Robolectric) for D-pad focus/navigation. Test-only; the APK still has no dependencies.
android.testOptions.unitTests.includeAndroidResources = true
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
}
android.testOptions.unitTests.all { t ->
    t.systemProperty 'onlyStyle', System.getProperty('onlyStyle', '')
    t.systemProperty 'skipOnScreen', System.getProperty('skipOnScreen', 'false')
    t.systemProperty 'shotsDir', System.getProperty('shotsDir', '/workspace/v24-shots/robolectric')
}
